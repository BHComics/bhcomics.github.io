<!DOCTYPE html>
<html lang="en-US">
  <head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <title>{{ page.title | default: site.title }}</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;600;700;900&family=Work+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{{ '/assets/css/style.css?v=' | append: site.github.build_revision | relative_url }}">
  </head>

  <body>

    <header class="site-header">
      <div class="nav-wrap">
        <a href="/" class="brand"><span class="mark"></span> Black Hole Comics</a>
        <button class="nav-toggle" id="nav-toggle" type="button" aria-label="Open menu" aria-expanded="false" aria-controls="site-nav">
          <span></span><span></span><span></span>
        </button>
        <nav class="links" id="site-nav">
          <a href="/"{% if page.url == '/' %} class="active"{% endif %}>Home</a>
          <a href="/download/"{% if page.url == '/download/' %} class="active"{% endif %}>Download</a>
          <a href="/events/"{% if page.url == '/events/' %} class="active"{% endif %}>Events</a>
          <a href="/artists/"{% if page.url == '/artists/' %} class="active"{% endif %}>Artists</a>
          <a href="/about/"{% if page.url == '/about/' %} class="active"{% endif %}>About</a>
        </nav>
      </div>
    </header>

    <main id="content">
      {{ content }}
    </main>

    <footer>
      <div class="divider-motif">✦ ✦ ✦</div>
      <div class="contact">
        📬 Contact us:
        <a href="mailto:blackholecomicproject@gmail.com">blackholecomicproject@gmail.com</a>
      </div>
      <div class="sponsor-primary">
        <a href="https://www.carlsbergfondet.dk/en/what-we-have-funded/cm25-0287/" target="_blank" rel="noopener noreferrer" class="logo-chip">
          <img src="/images/footer/carlsberg.png" alt="Carlsberg Mindelegat">
        </a>
        <a href="https://the-center-of-gravity.com/" target="_blank" rel="noopener noreferrer" class="logo-chip">
          <img src="/images/footer/cog.png" alt="The Center of Gravity">
        </a>
      </div>
      <div class="sponsor-secondary">
        <a href="https://villumfonden.dk/en/projekt/exploring-uncharted-universe-gravitational-waves" target="_blank" rel="noopener noreferrer" class="logo-chip">
          <img src="/images/footer/villum.png" alt="Villum Fonden">
        </a>
        <a href="https://hyperboloid.al/" target="_blank" rel="noopener noreferrer" class="logo-chip logo-chip-text">
          <img src="/images/footer/hyperboloidal-mark.png" alt="">
          <span>hyperboloid.al</span>
        </a>
        <a href="https://cdn-contenu.quebec.ca/cdn-contenu/adm/min/relations-internationales/Representations/Londres/publications/en/BR-Brochure-Quebec-Culture-August-November2026-EN-MRIF.pdf" target="_blank" rel="noopener noreferrer" class="logo-chip">
          <img src="/images/footer/quebec.png" alt="Québec">
        </a>
        <a href="https://spektakelpress.com" target="_blank" rel="noopener noreferrer" class="logo-chip">
          <img src="/images/footer/spektakel.png" alt="Spektakel Tryk &amp; Grafik">
        </a>
      </div>
    </footer>

    <script>
      (function () {
        var toggle = document.getElementById('nav-toggle');
        var nav = document.getElementById('site-nav');
        if (!toggle || !nav) return;

        function setOpen(open) {
          nav.classList.toggle('is-open', open);
          toggle.classList.toggle('is-open', open);
          toggle.setAttribute('aria-expanded', open ? 'true' : 'false');
        }

        toggle.addEventListener('click', function () {
          setOpen(!nav.classList.contains('is-open'));
        });
        nav.querySelectorAll('a').forEach(function (a) {
          a.addEventListener('click', function () { setOpen(false); });
        });
      })();
    </script>

  </body>
</html>
