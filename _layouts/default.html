<!DOCTYPE html>
<html lang="en-US">
  <head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <title>{{ page.title | default: site.title }}</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;600;700;900&family=Work+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{{ '/assets/css/style.css?v=' | append: site.github.build_revision | relative_url }}">
  </head>

  <body>

    <header class="site-header">
      <div class="nav-wrap">
        <a href="/" class="brand"><span class="mark"></span> Black Hole Comics</a>
        <nav class="links">
          <a href="/"{% if page.url == '/' %} class="active"{% endif %}>Home</a>
          <a href="/download/"{% if page.url == '/download/' %} class="active"{% endif %}>Download</a>
          <a href="/artists/"{% if page.url == '/artists/' %} class="active"{% endif %}>Artists</a>
          <a href="/about/"{% if page.url == '/about/' %} class="active"{% endif %}>About</a>
        </nav>
      </div>
    </header>

    <main id="content">
      {{ content }}
    </main>

    <footer>
      <div class="divider-motif">✦ ✦ ✦</div>
      <div class="contact">
        📬 Contact us:
        <a href="mailto:blackholecomicproject@gmail.com">blackholecomicproject@gmail.com</a>
      </div>
      <div class="sponsor-row">
        <a href="https://www.carlsbergfondet.dk/en/what-we-have-funded/cm25-0287/" target="_blank" rel="noopener noreferrer">
          <img src="/images/Carlsberg-Mindelegat-Green-RGB-DK.png" alt="Carlsberg Foundation" style="height:70px;">
        </a>
        <img src="/images/Villum_fonden_logo.png" alt="Villum Fonden" style="height:38px;">
        <a href="https://hyperboloid.al/" target="_blank" rel="noopener noreferrer">
          <img src="/images/hyperboloidal_transparent.png" alt="Hyperboloidal Research Network" style="height:52px;">
        </a>
        <img src="/images/QUEBipr_1920x1080-trans.png" alt="Québec" style="height:32px; opacity:0.85;">
      </div>
    </footer>

  </body>
</html>
